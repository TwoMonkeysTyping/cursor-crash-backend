basePath: /
definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.LoginResponse:
    properties:
      message:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.RegisterResponse:
    properties:
      message:
        type: string
    type: object
  main.DocumentInitRequest:
    properties:
      language:
        type: string
    type: object
  main.DocumentInitResponse:
    properties:
      document:
        $ref: '#/definitions/models.Document'
      message:
        type: string
    type: object
  models.Document:
    properties:
      content:
        type: string
      createdAt:
        type: string
      id:
        type: string
      isSaved:
        type: boolean
      language:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a sample API using Swagger in Go.
  title: My API
  version: "1.0"
paths:
  /documents:
    post:
      consumes:
      - application/json
      description: Initializes a new document with the selected language. A temporary
        name is assigned ("Untitled").
      parameters:
      - description: Document language
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.DocumentInitRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.DocumentInitResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Create a new document
      tags:
      - documents
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates a user with email and password
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "405":
          description: Method Not Allowed
          schema:
            type: string
      summary: User login
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: Registers a new user with email and password
      parameters:
      - description: Registration information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "409":
          description: Email already registered
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: User registration
      tags:
      - auth
swagger: "2.0"
